services:
  - type: web
    name: creatoros-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build:render
    startCommand: npm run prisma:initialize:postgres && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: MOCK_AI
        value: "false"
